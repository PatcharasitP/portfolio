<style>
/* ── โทเคนดีไซน์ ───────────────────────────────────────────────────────────
   ค่าทั้งหมดอิงงานวิจัยที่เก็บไว้ใน .claude/research/2026-09-07-portfolio-ux-design.md
   · type scale 1.25 (Major Third) จาก base 17px
   · line-height เนื้อความ 1.75 (สูงกว่าค่าแนะนำสากล 1.6 เพราะภาษาไทยมีสระบน-ล่าง)
   · โหมดมืดไม่ใช้ดำสนิท/ขาวสนิท เพื่อลดอาการล้าตาและขอบเรืองของตัวอักษร
   · คู่สีทุกคู่ผ่านเกณฑ์ contrast 4.5:1 ของ WCAG 2.1 AA */
:root{
  --bg:#fbfbfa; --surface:#ffffff; --surface-2:#f4f4f2;
  --line:#e3e3df; --line-soft:#ececeb;
  --text:#1a1a18; --text-2:#4a4a46; --text-3:#6b6b64;
  --accent:#1d4ed8; --accent-soft:#eef2ff;
  --ok:#0f7b4f;
  --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(20,20,18,.05), 0 8px 24px rgba(20,20,18,.05);
  --maxw:920px;
  --font:"Sarabun","IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Code",Consolas,monospace;
}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1c1c1b; --surface-2:#232322;
  --line:#33332f; --line-soft:#2a2a28;
  --text:#e6e6e1; --text-2:#b4b4ad; --text-3:#8a8a82;
  --accent:#93b4ff; --accent-soft:#1e2438;
  --ok:#5ed6a0;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141414; --surface:#1c1c1b; --surface-2:#232322;
    --line:#33332f; --line-soft:#2a2a28;
    --text:#e6e6e1; --text-2:#b4b4ad; --text-3:#8a8a82;
    --accent:#93b4ff; --accent-soft:#1e2438;
    --ok:#5ed6a0;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font); font-size:17px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{line-height:1.3; margin:0; font-weight:700; letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:4px}

.wrap{max-width:var(--maxw); margin:0 auto; padding:0 clamp(18px,5vw,28px)}

/* ── แถบบน ── */
.top{
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-soft);
}
.top .wrap{display:flex; align-items:center; gap:10px; padding-top:11px; padding-bottom:11px}
.top .me{font-weight:700; font-size:15px; letter-spacing:-.01em}
.top .sp{flex:1}
.ghost{
  border:1px solid var(--line); background:var(--surface); color:var(--text-2);
  border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:600;
  cursor:pointer; font-family:inherit; line-height:1.6;
}
.ghost:hover{color:var(--text); border-color:var(--text-3)}

/* ── ส่วนหัว ── */
.hero{padding:clamp(44px,8vw,76px) 0 clamp(26px,4vw,36px)}
.hero-grid{display:flex; gap:clamp(20px,4vw,44px); align-items:flex-start}
.hero-main{flex:1; min-width:0}
.kicker{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.12em;
  color:var(--text-3); margin-bottom:14px; text-transform:uppercase;
}
.hero h1{font-size:clamp(32px,6vw,50px); margin-bottom:16px; line-height:1.18}
.lead{font-size:clamp(16px,2.4vw,18.5px); color:var(--text-2); max-width:56ch}
.hero-photo{
  width:clamp(104px,14vw,148px); height:auto;   /* height:auto จำเป็น ไม่งั้น attribute height ใน HTML จะทับสัดส่วน */
  aspect-ratio:284/351; flex:none; align-self:flex-start;
  border-radius:var(--radius); object-fit:cover; object-position:center top;
  border:1px solid var(--line); background:var(--surface-2);
}
.cta{display:flex; gap:10px; flex-wrap:wrap; margin-top:26px}
.btn{
  display:inline-flex; align-items:center; gap:7px;
  border:1px solid var(--text); background:var(--text); color:var(--bg);
  border-radius:999px; padding:10px 20px; font-size:14.5px; font-weight:650;
  cursor:pointer; font-family:inherit; text-decoration:none; line-height:1.6;
}
.btn:hover{opacity:.87; text-decoration:none}
.btn.alt{background:var(--surface); color:var(--text); border-color:var(--line)}
.btn.alt:hover{border-color:var(--text-3); opacity:1}

/* ── ตัวเลขสรุป ── */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:clamp(28px,5vw,40px)}
.stat{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); padding:16px 15px}
.stat b{display:block; font-size:clamp(20px,3.4vw,26px); line-height:1.25; letter-spacing:-.02em}
.stat span{display:block; font-size:11.5px; color:var(--text-3); line-height:1.55; margin-top:5px}

/* ── ส่วนเนื้อหา ── */
section{padding:clamp(34px,6vw,54px) 0; border-top:1px solid var(--line-soft)}
.sec-head{display:flex; align-items:baseline; gap:12px; margin-bottom:22px; flex-wrap:wrap}
.sec-head h2{font-size:clamp(19px,3vw,23px)}
.sec-note{font-size:13.5px; color:var(--text-3); flex:1; min-width:200px}
.about p + p{margin-top:14px}
.about{color:var(--text-2); max-width:70ch}

/* ── การ์ดผลงาน ── */
.proj{
  background:var(--surface); border:1px solid var(--line-soft);
  border-radius:var(--radius); padding:clamp(18px,3vw,26px); box-shadow:var(--shadow);
}
.proj + .proj{margin-top:16px}
.proj-tag{font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--accent); text-transform:uppercase}
.proj h3{font-size:clamp(17px,2.6vw,20px); margin:9px 0 0; line-height:1.4}
.proj-links{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.chip{
  display:inline-flex; align-items:center; gap:5px;
  border:1px solid var(--line); border-radius:999px; padding:5px 13px;
  font-size:12.5px; font-weight:600; color:var(--text-2); background:var(--surface-2);
}
a.chip:hover{color:var(--text); border-color:var(--text-3); text-decoration:none}
.stack{display:flex; gap:6px; flex-wrap:wrap; margin-top:14px}
.stack span{
  font-family:var(--mono); font-size:11px; color:var(--text-3);
  border:1px solid var(--line-soft); border-radius:6px; padding:3px 8px; background:var(--surface-2);
}
.impact{
  margin-top:11px; font-size:15.5px; color:var(--text); line-height:1.65;
  padding-left:13px; border-left:3px solid var(--accent);
}
/* แถบข้อมูลผลงานกับผลลัพธ์เป็นข้อมีเลข (24/09/2026 จากงานศึกษา Galaxy Portfolio) */
.proj-meta{display:flex; gap:16px; flex-wrap:wrap; margin-top:7px; font-family:var(--mono); font-size:11.5px; color:var(--text-3); letter-spacing:.02em}
.proj-meta .live::before{content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:#2f9e6a; margin-right:6px; vertical-align:1px}
.results{list-style:none; counter-reset:r; margin:12px 0 0; padding:0; display:grid; gap:8px}
.results li{counter-increment:r; display:grid; grid-template-columns:30px 1fr; gap:2px; font-size:15px; line-height:1.65; color:var(--text)}
.results li::before{content:counter(r, decimal-leading-zero); font-family:var(--mono); font-size:12px; color:var(--accent); padding-top:3px}
/* ภาพเส้นบางประจำผลงาน, ตัวเลขนับขึ้น, จุดใช้งานจริงกระเพื่อม (พี่ปอนด์ให้ทำต่อ 24/09/2026 จากทางเลือก Q2 Q3)
   ท่าขยับทั้งหมดอยู่ใต้ prefers-reduced-motion: no-preference คนที่ตั้งลดการเคลื่อนไหวเห็นภาพสุดท้ายนิ่ง ๆ */
.proj{position:relative}
.proj-art{position:absolute; top:24px; right:24px; width:150px; height:96px; color:var(--text-3); pointer-events:none}
.proj-art svg{display:block; width:100%; height:100%; overflow:visible}
.proj-art .ax,.proj-art .win{fill:none; stroke:currentColor; stroke-width:1.2; opacity:.55; stroke-linecap:round; stroke-linejoin:round}
.proj-art .acc{fill:none; stroke:var(--accent); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.proj-art .dot{fill:var(--accent); opacity:.85}
.proj-art .bar{fill:var(--accent); fill-opacity:.16; stroke:var(--accent); stroke-width:1.2}
.proj-art .dup{opacity:.12}
.proj-art .draw{stroke-dasharray:1; stroke-dashoffset:0}
.proj.has-art .proj-tag,.proj.has-art h3,.proj.has-art .proj-meta{padding-right:176px}
.stat b{font-variant-numeric:tabular-nums}
@media (max-width:720px){ .proj-art{display:none} .proj.has-art .proj-tag,.proj.has-art h3,.proj.has-art .proj-meta{padding-right:0} }
@media (prefers-reduced-motion: no-preference){
  .proj-art .dot,.proj-art .file,.proj-art .spin{transform-box:fill-box; transform-origin:center}
  .proj-art .bar{transform-box:fill-box; transform-origin:50% 100%}
  .proj-art .dot{animation:artDot 8s ease-out infinite both}
  .proj-art .draw{animation:artDraw 8s ease-in-out infinite both}
  .proj-art .file{animation:artFile 8s ease-in-out infinite both}
  .proj-art .spin{animation:artSpin 8s linear infinite}
  .proj-art .bar{animation:artBar 8s ease-out infinite both}
  .proj-art .dup{animation:artDup 8s ease-in-out infinite both}
  .proj-art .pkt{animation:artPkt 8s ease-in-out infinite both}
  .proj-meta .live::before{animation:livePulse 2.6s ease-out infinite}
}
@keyframes artDot{0%{opacity:0; transform:scale(.4)} 8%{opacity:.85; transform:none} 88%{opacity:.85} 100%{opacity:0}}
@keyframes artDraw{0%,18%{stroke-dashoffset:1} 42%{stroke-dashoffset:0} 88%{stroke-dashoffset:0; opacity:1} 100%{stroke-dashoffset:0; opacity:0}}
@keyframes artFile{0%,10%{transform:translate(0,0)} 30%,60%{transform:translate(0,10px)} 80%,100%{transform:translate(0,0)}}
@keyframes artSpin{to{transform:rotate(360deg)}}
@keyframes artBar{0%{transform:scaleY(0)} 15%{transform:scaleY(1)} 88%{transform:scaleY(1); opacity:1} 100%{transform:scaleY(1); opacity:0}}
@keyframes artDup{0%,15%{opacity:.9} 32%,88%{opacity:.12} 100%{opacity:.9}}
@keyframes artPkt{0%{transform:translateX(0); opacity:0} 6%{opacity:1} 30%{transform:translateX(20px)} 45%{transform:translateX(50px)} 65%{transform:translateX(70px); opacity:1} 80%,100%{transform:translateX(70px); opacity:0}}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(47,158,106,.45)} 70%{box-shadow:0 0 0 7px rgba(47,158,106,0)} 100%{box-shadow:0 0 0 0 rgba(47,158,106,0)}}
.carl{margin-top:16px; border-top:1px solid var(--line-soft); padding-top:14px}
.carl > summary{
  cursor:pointer; font-size:13.5px; font-weight:650; color:var(--text-2);
  list-style:none; display:inline-flex; align-items:center; gap:7px;
}
.carl > summary::-webkit-details-marker{display:none}
.carl > summary::before{content:"+"; font-family:var(--mono); color:var(--accent); font-size:15px}
.carl[open] > summary::before{content:"–"}
.carl > summary:hover{color:var(--text)}
.carl dl{display:grid; grid-template-columns:112px 1fr; gap:9px 18px; margin:16px 0 0}
.carl dt{font-size:12.5px; font-weight:700; color:var(--text-3); padding-top:2px}
.carl dd{margin:0; font-size:15px; color:var(--text-2); line-height:1.7}

/* ── ทักษะ ── */
.skill-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:14px}
.skill-card{background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius); padding:17px}
.skill-card h3{font-size:13px; color:var(--text-3); text-transform:uppercase; letter-spacing:.06em; margin-bottom:11px}
.skill-card ul{list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px}
.skill-card li{font-size:13px; background:var(--surface-2); border:1px solid var(--line-soft); border-radius:7px; padding:4px 10px; color:var(--text-2)}

/* ── ประสบการณ์ / การศึกษา ── */
.item{display:grid; grid-template-columns:170px 1fr; gap:8px 22px; padding:18px 0; border-bottom:1px solid var(--line-soft)}
.item:last-child{border-bottom:0; padding-bottom:0}
.item-when{font-size:13px; color:var(--text-3); font-family:var(--mono); padding-top:3px}
.item h3{font-size:16.5px}
.item .org{font-size:14.5px; color:var(--text-2); margin-top:2px}
.item ul{margin:10px 0 0; padding-left:18px; color:var(--text-2); font-size:15px}
.item li{margin-bottom:5px}
.item .note{font-size:13.5px; color:var(--text-3); margin-top:3px}

/* ── ติดต่อ ── */
.contact-box{
  background:var(--surface); border:1px solid var(--line-soft); border-radius:var(--radius);
  padding:clamp(22px,4vw,32px); text-align:center; box-shadow:var(--shadow);
}
.contact-box h2{font-size:clamp(20px,3.4vw,26px); margin-bottom:10px}
.contact-box p{color:var(--text-2); max-width:52ch; margin:0 auto 20px}
.contact-links{display:flex; gap:10px; justify-content:center; flex-wrap:wrap}
footer{padding:26px 0 40px; text-align:center; color:var(--text-3); font-size:12.5px}

/* ── โผล่ขึ้นเบา ๆ ตอนเลื่อนถึง (ปิดอัตโนมัติถ้าผู้ใช้ตั้งค่าลดการเคลื่อนไหว) ── */
.reveal{opacity:0; transform:translateY(10px)}
.reveal.in{opacity:1; transform:none; transition:opacity .5s ease, transform .5s ease}
@media (prefers-reduced-motion: reduce){
  .reveal{opacity:1; transform:none}
  .reveal.in{transition:none}
}

@media (max-width:720px){
  .hero{padding-top:30px}
  .hero-grid{flex-direction:column; align-items:flex-start; gap:18px}
  .hero-photo{
    width:88px; aspect-ratio:1/1; border-radius:50%;
    object-position:center 22%;   /* เลื่อนกรอบขึ้นให้ใบหน้าอยู่กลางวงกลมพอดี */
    order:-1;                     /* ในลำดับ DOM รูปอยู่หลังข้อความ (เพื่อให้เดสก์ท็อปวางขวา)
                                     บนมือถือจึงต้องดึงขึ้นมาไว้บนสุดด้วย order */
  }
  .hero h1{font-size:clamp(28px,8vw,36px)}
  .cta{width:100%}
  .cta .btn{flex:1 1 auto; justify-content:center; min-width:132px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .carl dl{grid-template-columns:1fr; gap:3px 0}
  .carl dt{padding-top:10px}
  .item{grid-template-columns:1fr; gap:4px}
  .item-when{order:-1}
}
</style>
</head>
